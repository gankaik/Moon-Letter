<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Moon Letter · Mobile Check</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #081321; color: #f5f3ea; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 18px; }
      main { width: min(100%, 560px); padding: 28px 22px; border: 1px solid #52667a; border-radius: 16px; background: #0d1d2d; box-shadow: 0 14px 46px rgba(0, 0, 0, .32); }
      h1 { margin: 0 0 8px; font-size: clamp(26px, 7vw, 34px); letter-spacing: .04em; }
      .subtitle { margin: 0 0 26px; color: #bdcbd1; font-size: 16px; line-height: 1.65; }
      .row { padding: 16px 0; border-top: 1px solid #314658; }
      .label { display: block; margin-bottom: 7px; color: #aebfc8; font-size: 14px; }
      .value { margin: 0; color: #f9f6ed; font-size: 18px; line-height: 1.55; overflow-wrap: anywhere; }
      .ok { color: #83e0a6; font-weight: 700; }
      .pending { color: #f1cd79; font-weight: 700; }
      footer { margin: 25px 0 0; color: #8fa3ae; font-size: 13px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>Mobile Check</h1>
      <p class="subtitle">Moon Letter 独立诊断页面。此页面不加载 React、Vite 运行时、Three.js、外部字体或 CDN。</p>
      <section class="row">
        <span class="label">HTML</span>
        <p class="value ok">✓ HTML 加载成功</p>
      </section>
      <section class="row">
        <span class="label">JavaScript</span>
        <p class="value pending" id="js-status">… 正在检查脚本执行</p>
      </section>
      <section class="row">
        <span class="label">当前时间</span>
        <p class="value" id="current-time">正在读取</p>
      </section>
      <section class="row">
        <span class="label">浏览器 User-Agent</span>
        <p class="value" id="user-agent">正在读取</p>
      </section>
      <footer>若本页正常显示，说明 Cloudflare 静态资源、HTML 与基础 JavaScript 在当前设备上可用。</footer>
    </main>
    <script>
      (function () {
        var status = document.getElementById('js-status');
        status.textContent = '✓ JavaScript 执行成功';
        status.className = 'value ok';
        document.getElementById('user-agent').textContent = navigator.userAgent || 'Unavailable';
        function updateTime() {
          document.getElementById('current-time').textContent = new Date().toLocaleString('zh-CN', { hour12: false });
        }
        updateTime();
        window.setInterval(updateTime, 1000);
      }());
    </script>
  </body>
</html>
